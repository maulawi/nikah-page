<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Engagement Mubarak 💍</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 12px;
      font-size: 16px;
      margin: 8px;
      border-radius: 6px;
      border: none;
      width: 260px;
    }

    button {
      background: #22c55e;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #16a34a;
    }

    #result {
      margin-top: 30px;
      font-size: 18px;
      line-height: 1.8;
    }

    .dua {
      margin-top: 15px;
      font-style: italic;
      color: #facc15;
    }
  </style>
</head>

<body>

  <h1>💍 Engagement Mubarak 💍</h1>

  <input id="name" placeholder="Enter groom's name"><br>

  <button onclick="showDua()">Make Duʿāʾ 🤍</button>

  <div id="result"></div>

  <script>
    function showDua() {
      let name = document.getElementById("name").value;

      document.getElementById("result").innerHTML = `
        🌸 <strong>Congratulations ${name}</strong> 🌸<br><br>

        May Allah bless your engagement and unite your hearts in goodness.<br>

        <div class="dua">
          اللّهُمَّ بَارِكْ لَهُمَا، وَبَارِكْ عَلَيْهِمَا،  
          وَاجْمَعْ بَيْنَهُمَا فِي خَيْرٍ 🤲
        </div>

        <br>
        May Allah grant you love, mercy, tranquillity  
        and a marriage filled with barakah 🌙
      `;
    }
  </script>

</body>
</html>
